# The verification gate for this fork.
#
# It calls podman/ci-gate.sh and nothing else, so the checks CI runs are the
# same ones a developer runs locally, with no second definition to drift.
#
# Constraints this workflow deliberately observes:
#   - no secrets are referenced, and the token is read-only
#   - nothing is published, released, tagged or pushed
#   - it never runs against the upstream repository
#   - every action is pinned to a commit SHA, not a tag
#
# IMPORTANT: at the time this file was committed GitHub registered NO workflows
# for this fork (`GET /repos/ktryk12/rea/actions/workflows` returned
# total_count 0, and total runs 0 after several pushes and a pull request).
# Workflows do not run in a fork until Actions is enabled for it in the
# repository's Actions tab, which is a manual owner action and cannot be done
# through the API. Until then this file is configuration, not a passing gate.
#
# Enabling Actions here also registers the 29 workflow files inherited from
# upstream, including release.yml (push and pull_request on main) and
# pr-readiness.yml (pull_request_target). Their publishing steps are gated on
# `github.event_name == 'push'` and on workflow_dispatch with
# `inputs.phase == 'publish'`, so a pull request would not publish, but that is
# an owner decision rather than something to switch on silently. See
# virkora/TEST_BASELINE.md and the final provenance report.

name: virkora gate

# A pull request and a push to the same branch would otherwise run this gate
# twice for one commit, since their refs differ and concurrency cannot collapse
# them. Pushes are therefore gated on main only; feature branches are covered
# by their pull request, and workflow_dispatch covers anything else.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virkora-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Never run in the upstream repository, even if this file reaches it.
    if: github.repository == 'ktryk12/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the full history
        # The gate reconstructs the declared commit with `git archive`, so a
        # shallow clone is not enough.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Record the toolchain actually used
        run: |
          node --version
          npm --version
          podman --version
          podman info --format '{{.Host.Security.Rootless}} rootless, {{.Host.OCIRuntime.Name}} runtime'

      - name: Static checks
        run: ./podman/ci-gate.sh static

      - name: Provenance checks
        run: ./podman/ci-gate.sh provenance

      - name: Negative container checks
        run: ./podman/ci-gate.sh negative
